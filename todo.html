<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 500px;
    padding: 30px;
  }

  h1 {
    color: #333;
    margin-bottom: 10px;
    text-align: center;
    font-size: 28px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
  }

  .input-container {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s ease;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #667eea;
  }

  button {
    padding: 12px 25px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  button:hover {
    background: #5568d3;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
  }

  button:active {
    transform: translateY(0);
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 8px 16px;
    background: #f0f0f0;
    color: #333;
    border: 2px solid #f0f0f0;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .filter-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
  }

  .filter-btn:hover {
    border-color: #667eea;
  }

  .todo-list {
    max-height: 500px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    background: #f9f9f9;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: all 0.3s ease;
    border-left: 4px solid #ddd;
  }

  .todo-item:hover {
    background: #f0f0f0;
    border-left-color: #667eea;
  }

  .todo-item.completed {
    opacity: 0.6;
    border-left-color: #4caf50;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #999;
  }

  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #667eea;
  }

  .todo-text {
    flex: 1;
    word-break: break-word;
    color: #333;
  }

  .todo-actions {
    display: flex;
    gap: 8px;
  }

  .btn-delete {
    padding: 6px 12px;
    background: #f44336;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn-delete:hover {
    background: #da190b;
    transform: scale(1.05);
  }

  .btn-edit {
    padding: 6px 12px;
    background: #ff9800;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn-edit:hover {
    background: #e68900;
    transform: scale(1.05);
  }

  .stats {
    display: flex;
    justify-content: space-around;
    padding-top: 20px;
    border-top: 2px solid #f0f0f0;
    margin-top: 20px;
    text-align: center;
  }

  .stat {
    flex: 1;
  }

  .stat-number {
    font-size: 24px;
    font-weight: 700;
    color: #667eea;
    display: block;
  }

  .stat-label {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #999;
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 10px;
  }

  .clear-all-btn {
    width: 100%;
    margin-top: 15px;
    background: #f44336;
    padding: 10px;
  }

  .clear-all-btn:hover {
    background: #da190b;
  }

  .edit-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .edit-modal.active {
    display: flex;
  }

  .edit-modal-content {
    background: white;
    border-radius: 15px;
    padding: 30px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }

  .edit-modal h2 {
    margin-bottom: 20px;
    color: #333;
  }

  .edit-modal input {
    width: 100%;
    margin-bottom: 15px;
  }

  .edit-modal-buttons {
    display: flex;
    gap: 10px;
  }

  .edit-modal-buttons button {
    flex: 1;
  }

  .btn-cancel {
    background: #999;
  }

  .btn-cancel:hover {
    background: #777;
  }

  @media (max-width: 600px) {
    .container {
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }

    .input-container {
      flex-direction: column;
    }

    button {
      width: 100%;
    }

    .filters {
      justify-content: center;
    }

    .stats {
      gap: 20px;
    }
  }

  ::-webkit-scrollbar {
    width: 8px;
  }

  ::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #5568d3;
  }
</style>
</head>
<body>

<div class="container">
  <h1>✓ My Tasks</h1>
  <p class="subtitle">Stay organized and get things done</p>

  <div class="input-container">
    <input type="text" id="todoInput" placeholder="Add a new task..." />
    <button onclick="addTodo()">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterTodos('all')">All</button>
    <button class="filter-btn" onclick="filterTodos('pending')">Pending</button>
    <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
  </div>

  <div class="todo-list" id="todoList"></div>

  <div class="stats">
    <div class="stat">
      <span class="stat-number" id="totalCount">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="pendingCount">0</span>
      <span class="stat-label">Pending</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="completedCount">0</span>
      <span class="stat-label">Completed</span>
    </div>
  </div>

  <button class="clear-all-btn" onclick="confirmClearAll()">Clear All Completed</button>
</div>

<div class="edit-modal" id="editModal">
  <div class="edit-modal-content">
    <h2>Edit Task</h2>
    <input type="text" id="editInput" placeholder="Edit your task..." />
    <div class="edit-modal-buttons">
      <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      <button onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
  let todos = [];
  let currentFilter = 'all';
  let editingId = null;

  // Load todos from local storage on page load
  window.addEventListener('DOMContentLoaded', () => {
    loadTodos();
    renderTodos();
  });

  // Load todos from localStorage
  function loadTodos() {
    const saved = localStorage.getItem('todos');
    todos = saved ? JSON.parse(saved) : [];
  }

  // Save todos to localStorage
  function saveTodos() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  // Add a new todo
  function addTodo() {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();

    if (text === '') {
      alert('Please enter a task');
      return;
    }

    if (text.length > 200) {
      alert('Task is too long (max 200 characters)');
      return;
    }

    const newTodo = {
      id: Date.now(),
      text: text,
      completed: false,
      createdAt: new Date().toLocaleString()
    };

    todos.unshift(newTodo);
    saveTodos();
    renderTodos();
    input.value = '';
    input.focus();
  }

  // Toggle todo completion
  function toggleTodo(id) {
    todos = todos.map(todo =>
      todo.id === id ? { ...todo, completed: !todo.completed } : todo
    );
    saveTodos();
    renderTodos();
  }

  // Delete a todo
  function deleteTodo(id) {
    if (confirm('Are you sure you want to delete this task?')) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      renderTodos();
    }
  }

  // Open edit modal
  function openEditModal(id) {
    editingId = id;
    const todo = todos.find(t => t.id === id);
    document.getElementById('editInput').value = todo.text;
    document.getElementById('editModal').classList.add('active');
    document.getElementById('editInput').focus();
  }

  // Close edit modal
  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
    editingId = null;
  }

  // Save edit
  function saveEdit() {
    const newText = document.getElementById('editInput').value.trim();

    if (newText === '') {
      alert('Task cannot be empty');
      return;
    }

    todos = todos.map(todo =>
      todo.id === editingId ? { ...todo, text: newText } : todo
    );

    saveTodos();
    renderTodos();
    closeEditModal();
  }

  // Filter todos
  function filterTodos(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
    renderTodos();
  }

  // Get filtered todos
  function getFilteredTodos() {
    if (currentFilter === 'completed') {
      return todos.filter(todo => todo.completed);
    } else if (currentFilter === 'pending') {
      return todos.filter(todo => !todo.completed);
    }
    return todos;
  }

  // Render todos
  function renderTodos() {
    const todoList = document.getElementById('todoList');
    const filtered = getFilteredTodos();

    if (filtered.length === 0) {
      todoList.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>${currentFilter === 'completed' ? 'No completed tasks yet' : currentFilter === 'pending' ? 'No pending tasks' : 'No tasks yet. Add one to get started!'}</p>
        </div>
      `;
    } else {
      todoList.innerHTML = filtered.map(todo => `
        <div class="todo-item ${todo.completed ? 'completed' : ''}">
          <input 
            type="checkbox" 
            ${todo.completed ? 'checked' : ''} 
            onchange="toggleTodo(${todo.id})"
          />
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <div class="todo-actions">
            <button class="btn-edit" onclick="openEditModal(${todo.id})">Edit</button>
            <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    updateStats();
  }

  // Update statistics
  function updateStats() {
    const total = todos.length;
    const completed = todos.filter(todo => todo.completed).length;
    const pending = total - completed;

    document.getElementById('totalCount').textContent = total;
    document.getElementById('completedCount').textContent = completed;
    document.getElementById('pendingCount').textContent = pending;
  }

  // Clear all completed todos
  function confirmClearAll() {
    const completed = todos.filter(todo => todo.completed).length;
    if (completed === 0) {
      alert('No completed tasks to clear');
      return;
    }

    if (confirm(`Delete ${completed} completed task(s)?`)) {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      renderTodos();
    }
  }

  // Escape HTML to prevent XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Allow Enter key to add todo
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('todoInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('editInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveEdit();
    });
  });
</script>

</body>
</html>
